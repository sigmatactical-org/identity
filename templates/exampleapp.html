{% extends "base.html" %}

{% block brand %}Sigma Identity{% endblock %}

{% block main_class %}app-main{% endblock %}

{% block content %}
<div class="container app-demo">
  <p class="status-line">
    Login status: <strong id="loginStatus"></strong><br />
    CSRF token: <code id="csrftoken"></code>
  </p>
  <h2>Actions</h2>
  <div class="actions">
    <button id="login" type="button" class="btn btn-primary btn-sm">Login</button>
    <button id="logout" type="button" class="btn btn-outline-secondary btn-sm">Logout</button>
    <button id="refresh" type="button" class="btn btn-outline-secondary btn-sm">Refresh</button>
    <button id="requestcsrftoken" type="button" class="btn btn-outline-secondary btn-sm">CSRF token</button>
    <button id="echorequest" type="button" class="btn btn-outline-secondary btn-sm">Echo request</button>
  </div>
  <div class="echo-grid">
    <div class="echo-col">
      <label for="userinput" class="form-label">Message</label>
      <textarea id="userinput"></textarea>
    </div>
    <div class="echo-col">
      <label for="echoresponse" class="form-label">Response</label>
      <div id="echoresponse"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script type="module" src="sample.js"></script>
{% endblock %}
