# Host-native dependencies for sigma-identity (Keycloak, echo).
# PostgreSQL runs in kind — port-forward with platform/scripts/postgres-dev.sh
# (see scripts/dev-stack.sh).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command:
      - start-dev
      - --import-realm
    ports:
      - "127.0.0.1:8101:8101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8101"
      KC_DB: postgres
      KC_DB_URL_HOST: host.docker.internal
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: sigma
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: sigma
      KC_DB_PASSWORD: sigma
    volumes:
      - ../dev_realm.json:/opt/keycloak/data/import/dev_realm.json
      - ../../theme/assets/keycloak/sigma/login:/opt/keycloak/themes/sigma/login:ro

  echo:
    build:
      context: ..
      dockerfile: .devcontainer/echo/Dockerfile
    ports:
      - "127.0.0.1:8088:3000"
