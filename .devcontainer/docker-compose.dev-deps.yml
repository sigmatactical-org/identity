# Host-native dependencies for sigma-identity (Keycloak, echo).
# PostgreSQL is started separately from sigma-pg/docker-compose.deps.yml
# (see scripts/dev-stack.sh).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command:
      - start-dev
      - --import-realm
    ports:
      - "127.0.0.1:8101:8101"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8101"
      KC_DB: postgres
      KC_DB_URL_HOST: host.docker.internal
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: sigma
      KC_DB_PASSWORD: sigma
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../dev_realm.json:/opt/keycloak/data/import/dev_realm.json

  echo:
    build:
      context: echo
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8088:3000"
