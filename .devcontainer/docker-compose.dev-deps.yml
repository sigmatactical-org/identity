# Host-native dependencies for sigma-identity (Keycloak, echo).
# PostgreSQL is started separately from sigma-pg/docker-compose.deps.yml
# (see scripts/dev-stack.sh).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command:
      - start-dev
      - --import-realm
    ports:
      - "127.0.0.1:8101:8101"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8101"
      KC_DB: postgres
      KC_DB_URL_HOST: sigma-pg-postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: sigma
      KC_DB_PASSWORD: sigma
    volumes:
      - ../dev_realm.json:/opt/keycloak/data/import/dev_realm.json
    networks:
      - sigma-dev

  echo:
    build:
      context: ..
      dockerfile: .devcontainer/echo/Dockerfile
    ports:
      - "127.0.0.1:8088:3000"

networks:
  sigma-dev:
    external: true
    name: sigma-dev
