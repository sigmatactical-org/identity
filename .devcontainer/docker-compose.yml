services:
  identity:
    image: mcr.microsoft.com/devcontainers/rust:2.0-bookworm
    environment:
      # kind Postgres via host port-forward (platform/scripts/postgres-dev.sh).
      - IDENTITY_DATABASE_URL=postgres://identity:sigma@host.docker.internal:5432/sigma
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8101:8101"
      - "3000:3000"
    volumes:
      - ..:/workspace:cached
    command: /bin/sh -c "while sleep 1000; do :; done"

  echo:
    build:
      context: ..
      dockerfile: .devcontainer/echo/Dockerfile

  # Dev-only: upstream Keycloak image (Red Hat UBI base; no official Debian image).
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command:
      - start-dev
      - --import-realm
    network_mode: "service:identity"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HTTP_PORT=8101
      - KC_DB=postgres
      - KC_DB_URL_HOST=host.docker.internal
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=sigma
      - KC_DB_PASSWORD=sigma
    volumes:
      - ../dev_realm.json:/opt/keycloak/data/import/dev_realm.json
      - ../../theme/assets/keycloak/sigma/login:/opt/keycloak/themes/sigma/login:ro
