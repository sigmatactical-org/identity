services:
  # Production image: Debian 13 distroless (see Dockerfile). Redis below: Debian bookworm.
  identity:
    build:
      context: build/image
      dockerfile: Dockerfile
    depends_on:
      - redis
      - keycloak
    environment:
      - PORT=3000
      - IDENTITY_BIND_PORT=3000
      - RUST_LOG=sigma_identity=debug,info
      - IDENTITY_PROXY_TARGET=http://echo:3000/api
      - IDENTITY_SESSION_REFRESH_THRESHOLD=15
      - IDENTITY_OIDC_ISSUER_URL=http://172.17.0.1:8084/realms/multcorp
      - IDENTITY_OIDC_CLIENT_ID=identity
      - IDENTITY_OIDC_CLIENT_SECRET=8d476311-2577-4104-b9e4-7dc2cc381be8
      - IDENTITY_REDIS_URL=redis://redis/
      - IDENTITY_SESSION_SECRET=iIdh4cBut27H6Y5MCk9782bE3Nk56JVsahla1vhILE3tizmX5nP5riOhV8IgorzI
      - IDENTITY_LOGOUT_SSO_URI=http://localhost:8084/realms/multcorp/protocol/openid-connect/logout
      - IDENTITY_LOGIN_REDIRECT_APP_URIS=http://localhost:3000/*
      - IDENTITY_OIDC_REDIRECT_URIS=http://localhost:3000/auth/callback
      - IDENTITY_LOGOUT_REDIRECT_APP_URIS=http://localhost:3000/exampleapp/
      - IDENTITY_LOGOUT_OIDC_REDIRECT_URIS=http://localhost:3000/auth/logoutcallback
    volumes:
      - ./files:/files:ro
    ports:
      - "3000:3000"

  redis:
    image: redis:7-bookworm

  echo:
    build:
      context: .devcontainer/echo
      dockerfile: Dockerfile

  # Dev-only: upstream Keycloak image (Red Hat UBI base; no official Debian image).
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    command:
      - start-dev
      - --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HTTP_PORT=8084
    volumes:
      - ./dev_realm.json:/opt/keycloak/data/import/dev_realm.json
    ports:
      - "8084:8084"
