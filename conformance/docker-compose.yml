# sigma-identity RP harness under test.
# Requires /etc/hosts: 127.0.0.1 localhost.emobix.co.uk keycloak.localhost
#
# PostgreSQL runs in the kind stack; port-forward with platform/scripts/postgres-dev.sh
# before starting this stack. Identity reaches it via host.docker.internal:5432.
#
# The upstream OIDC conformance suite requires MongoDB, so it is not run here.
# Set CONFORMANCE_SERVER to a hosted suite URL when running plans.

name: sigma-identity-conformance

networks:
  conformance-net:
    name: sigma-identity-conformance

services:
  echo:
    build:
      context: ..
      dockerfile: .devcontainer/echo/Dockerfile
    networks:
      - conformance-net

  identity:
    image: mcr.microsoft.com/devcontainers/rust:2.0-bookworm
    environment:
      IDENTITY_DATABASE_URL: postgres://sigma:sigma@host.docker.internal:5432/sigma
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost.emobix.co.uk:host-gateway"
    volumes:
      - ..:/workspace:cached
    command: /bin/sh -c "while sleep 1000; do :; done"
    networks:
      - conformance-net

  traefik:
    build:
      context: ../.devcontainer/traefik
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    command:
      - "--providers.file.filename=/routing.yaml"
      - "--entrypoints.identity.address=:3000"
      - "--entrypoints.identity.http.tls=true"
      - "--log.level=INFO"
    volumes:
      - ./traefik-rp.yaml:/routing.yaml:ro
    depends_on:
      - identity
    networks:
      conformance-net:
        aliases:
          - identity.localhost
