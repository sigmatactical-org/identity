name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.0"
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: sigma
          POSTGRES_PASSWORD: sigma
          POSTGRES_DB: sigma
        options: >-
          --health-cmd "pg_isready -U sigma -d sigma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://sigma:sigma@127.0.0.1:5432/sigma
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: sigmatactical-org/sigma-theme
          path: theme
      - uses: actions/checkout@v7
        with:
          repository: sigmatactical-org/sigma-pg
          path: sigma-pg
      - uses: actions/checkout@v7
        with:
          repository: sigmatactical-org/human-check
          path: human-check
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            theme/ts/package-lock.json
            ts/package-lock.json
      - name: Prepare build
        run: ./scripts/prepare-local.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Prepare PostgreSQL schema
        run: ./scripts/prepare-e2e-postgres.sh
      - run: cargo test --all-targets -- --test-threads=1

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: sigmatactical-org/sigma-theme
          path: theme
      - uses: actions/checkout@v7
        with:
          repository: sigmatactical-org/human-check
          path: human-check
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            theme/ts/package-lock.json
            ts/package-lock.json
      - name: Prepare build
        run: ./scripts/prepare-local.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: sigmatactical-org/human-check
          path: human-check
      - name: Patch human-check dependency
        run: |
          mkdir -p .cargo
          cat >.cargo/config.toml <<'EOF'
          [patch."https://github.com/sigmatactical-org/human-check.git"]
          sigma-human-check = { path = "human-check" }
          EOF
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: sigmatactical-org/human-check
          path: human-check
      - name: Patch human-check dependency
        run: |
          mkdir -p .cargo
          cat >.cargo/config.toml <<'EOF'
          [patch."https://github.com/sigmatactical-org/human-check.git"]
          sigma-human-check = { path = "human-check" }
          EOF
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit dependencies
        run: cargo audit
