name: Playwright

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.90.0"
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: always

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: sigmatactical-org/sigma-theme
          path: sigma-theme

      - name: Prepare build
        run: ./scripts/prepare-local.sh

      - name: Start E2E stack
        run: ./scripts/e2e-stack.sh up

      - name: Build identity in stack
        run: ./scripts/e2e-stack.sh build

      - name: Run identity service
        run: ./scripts/e2e-stack.sh run

      - name: Wait for identity
        run: ./scripts/e2e-stack.sh wait

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: tests
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 30

      - name: Stop E2E stack
        if: always()
        run: ./scripts/e2e-stack.sh down
