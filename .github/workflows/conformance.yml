name: OpenID Conformance

# Automated conformance requires a hosted OIDC conformance suite URL
# (certification.openid.net). Sigma infrastructure uses PostgreSQL only; the
# vendor suite depends on MongoDB and is not run in this repository.

on:
  workflow_dispatch:
    inputs:
      conformance_server:
        description: Hosted conformance suite base URL (required)
        required: true
        type: string
      plan:
        description: Plan name (empty = oidcc-client-test-plan; use "all" for every plan)
        required: false
        default: ""

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.0"
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: always
  CLIENT_ID: sigma-identity-conformance
  CLIENT_SECRET: conformance-client-secret-not-for-production
  CONFORMANCE_MODULE_SETTLE: "20"
  CONFORMANCE_MODULE_GAP: "25"
  CONFORMANCE_MODULE_TIMEOUT: "360"

jobs:
  rp-conformance:
    timeout-minutes: 150
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: sigma
          POSTGRES_PASSWORD: sigma
          POSTGRES_DB: sigma
        options: >-
          --health-cmd "pg_isready -U sigma -d sigma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CONFORMANCE_SERVER: ${{ inputs.conformance_server }}
      TEST_DATABASE_URL: postgres://sigma:sigma@127.0.0.1:5432/sigma
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: sigmatactical-org/sigma-theme
          path: theme

      - name: Prepare build
        run: ./scripts/prepare-local.sh

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Start identity conformance stack (PostgreSQL + RP harness)
        run: ./scripts/conformance-stack.sh up

      - name: Wait for hosted conformance suite
        run: ./scripts/conformance-stack.sh wait-suite

      - name: Build identity
        run: |
          cargo build --release -p sigma-conformance
          ./scripts/conformance-stack.sh build

      - name: Run RP conformance tests
        run: |
          plan="${{ inputs.plan }}"
          if [[ -n "$plan" ]]; then
            if [[ "$plan" == "all" ]]; then
              ./scripts/conformance-stack.sh test
            else
              ./scripts/conformance-stack.sh test --plan "$plan"
            fi
          else
            ./scripts/conformance-stack.sh test --plan oidcc-client-test-plan
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: conformance-results
          path: |
            conformance/.last-run.json
            conformance/.bootstrap-plan.json
          retention-days: 30

      - name: Stop stack
        if: always()
        run: ./scripts/conformance-stack.sh down
