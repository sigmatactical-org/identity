name: OpenID Conformance

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "conformance/**"
      - "conformance-tool/**"
      - "echo/**"
      - "scripts/conformance-stack.sh"
      - ".env.conformance-ci"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      plan:
        description: Plan name (empty = oidcc-client-test-plan; use "all" for every plan)
        required: false
        default: ""
  schedule:
    # Weekly Sunday 04:00 UTC — full certification matrix.
    - cron: "0 4 * * 0"

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.90.0"
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: always
  CONFORMANCE_SERVER: https://localhost.emobix.co.uk:8443
  CLIENT_ID: sigma-identity-conformance
  CLIENT_SECRET: conformance-client-secret-not-for-production
  CONFORMANCE_MODULE_SETTLE: "20"
  CONFORMANCE_MODULE_GAP: "25"
  CONFORMANCE_MODULE_TIMEOUT: "360"

jobs:
  rp-conformance:
    timeout-minutes: 150
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: sigmatactical-org/sigma-theme
          path: theme

      - name: Hosts for conformance suite
        run: echo "127.0.0.1 localhost.emobix.co.uk" | sudo tee -a /etc/hosts

      - name: Prepare build
        run: ./scripts/prepare-local.sh

      - name: Start conformance stack
        run: ./scripts/conformance-stack.sh up

      - name: Wait for conformance suite
        run: ./scripts/conformance-stack.sh wait-suite

      - name: Build identity
        run: ./scripts/conformance-stack.sh build

      - name: Run RP conformance tests
        run: |
          plan="${{ github.event.inputs.plan }}"
          if [[ -n "$plan" ]]; then
            if [[ "$plan" == "all" ]]; then
              ./scripts/conformance-stack.sh test
            else
              ./scripts/conformance-stack.sh test --plan "$plan"
            fi
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            ./scripts/conformance-stack.sh test
          else
            ./scripts/conformance-stack.sh test --plan oidcc-client-test-plan
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: conformance-results
          path: |
            conformance/.last-run.json
            conformance/.bootstrap-plan.json
          retention-days: 30

      - name: Stop stack
        if: always()
        run: ./scripts/conformance-stack.sh down
