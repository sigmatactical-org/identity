[workspace]
members = [".", "conformance-tool", "echo", "nav"]
exclude = ["sigma-pg"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.90.0"
license = "MIT OR Apache-2.0"

[package]
name = "sigma-identity"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Sigma Tactical Group contributors <https://github.com/sigmatactical-org>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.70"
askama = "0.16.0"
axum = "0.8.1"
axum-extra = { version = "0.12.5", features = ["cookie"] }
axum-macros = "0.5.0"
base64 = "0.22.1"
chrono = { version = "0.4.24", default-features = false }
cookie = { version = "0.18.1", features = ["private"] }
dotenvy = "0.15.7"
http-body-util = "0.1.2"
hyper = { version = "1.3", features = ["full"] }
hyper-util = { version = "0.1.5", features = ["client-legacy"] }
hyper-rustls = "0.27"
oauth2 = "5.0.0-rc.1"
openidconnect = "4.0.1"
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
time = "0.3.36"
tokio = { version = "1.27.0", features = [
    "fs",
    "macros",
    "rt-multi-thread",
    "signal",
] }
url = "2.5"
tower-http = { version = "0.6.2", features = ["fs", "trace", "set-header", "cors"] }
tower-sessions = { version = "0.14.0", features = ["private"] }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }
sigma-pg = { git = "https://github.com/sigmatactical-org/sigma-pg.git" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = { version = "0.5.2", features = ["util"] }
mimalloc = "0.1.43"
rustls = { version = "0.23.15", features = ["ring"] }
sigma-theme = { git = "https://github.com/sigmatactical-org/sigma-theme.git", default-features = false, features = ["askama", "axum"] }
sigma-human-check = { git = "https://github.com/sigmatactical-org/human-check.git" }
sigma-identity-nav = { path = "nav" }
sigma-cart-nav = { git = "https://github.com/sigmatactical-org/cart.git" }

[dev-dependencies]
hyper = "1.5.0"
once_cell = "1.20.2"
tracing-log = "0.2.0"
wiremock = "0.6.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
