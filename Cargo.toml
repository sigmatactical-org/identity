[workspace]
members = [".", "conformance-tool", "echo", "nav"]
exclude = ["sigma-pg"]
resolver = "2"

[workspace.package]


edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"

[package]


name = "sigma-identity"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Sigma Tactical Group contributors <https://github.com/sigmatactical-org>"]
homepage = "https://identity.sigma-tactical.com"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.103"
askama = "0.16.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-macros = "0.5.1"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false }
cookie = { version = "0.18.1", features = ["private"] }
dotenvy = "0.15.7"
futures = { version = "0.3.31", default-features = false, features = ["std"] }
http-body-util = "0.1.4"
hyper-util = { version = "0.1.20", features = ["client-legacy"] }
hyper-rustls = "0.27"
oauth2 = "5.0.0"
openidconnect = "4.0.1"
rand = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
time = "0.3.53"
tokio = { version = "1.52.3", features = [
    "fs",
    "macros",
    "rt-multi-thread",
    "signal",
] }
url = "2.5"
tower-http = { version = "0.7.0", features = ["fs", "trace", "set-header", "cors"] }
tower-sessions = { version = "0.15.0", features = ["private"] }
# The released 0.15.0 store is still on tower-sessions-core 0.14 / sqlx 0.8;
# git main pairs core 0.15 with sqlx 0.9. Drop the rev pin once a release ships.
tower-sessions-sqlx-store = { git = "https://github.com/maxcountryman/tower-sessions-stores.git", rev = "75cb75792d0a8d9231723b07e7524897201ef73b", features = ["postgres"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres"] }
sigma-pg = { git = "https://github.com/sigmatactical-org/sigma-pg.git", rev = "f34cf0eed7bb450df47bedd7dfa5bb10e5f99e47" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = { version = "0.5.3", features = ["util"] }
mimalloc = "0.1.52"
rustls = { version = "0.23.42", features = ["ring"] }
sigma-theme = { git = "https://github.com/sigmatactical-org/sigma-theme.git", rev = "1b31e85724e4de48ec5c57ecd19bebf34d87962d", default-features = false, features = ["askama", "axum"] }
sigma-human-check = { git = "https://github.com/sigmatactical-org/human-check.git", rev = "13f8c30bd056b09765906f06c768c1bae4be189d", features = ["axum"] }
sigma-identity-nav = { path = "nav" }

[dev-dependencies]
hyper = "1.10.1"
once_cell = "1.21.4"
tracing-log = "0.2.0"
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
